name: Sync upstream

on:
  schedule:
    # 每天北京时间 08:00（UTC 00:00）
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'SuddenCast03405/HMCL-fork'
    runs-on: ubuntu-latest
    env:
      FORK: SuddenCast03405/HMCL-fork
      UPSTREAM: HMCL-dev/HMCL
      BRANCH: main
      PATCH_TRAILER: 'HMCL-CN-Patch:'
      # Paths the fork publishes as its own copy, see .github/fork-owned-paths.txt.
      FORK_OWNED: .github/fork-owned-paths.txt
      # Scratch files live in $RUNNER_TEMP, outside the work tree, so branch switching stays clean.
      # A PAT is required to push changes under .github/workflows and, unlike
      # GITHUB_TOKEN, its push triggers Java CI. Without it the build is dispatched
      # explicitly below, but a sync that has to change a workflow file will fail.
      PUSH_TOKEN: ${{ secrets.HMCL_SYNC_TOKEN || secrets.GITHUB_TOKEN }}
      HAS_SYNC_TOKEN: ${{ secrets.HMCL_SYNC_TOKEN != '' }}

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.BRANCH }}
          fetch-depth: 0
          persist-credentials: false

      - name: Configure git identity
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      # Read-only on purpose: the push URL points at an unusable host, so no step in this
      # workflow can ever write to HMCL-dev/HMCL even if a push command is added later.
      - name: Fetch upstream
        run: |
          git remote add upstream "https://github.com/${UPSTREAM}.git"
          git remote set-url --push upstream "https://invalid.invalid/never-push.git"
          git fetch --no-tags --prune upstream "$BRANCH"
          echo "upstream=$(git rev-parse upstream/$BRANCH)" >> "$GITHUB_ENV"

      - name: Split the local commits from the upstream ones
        run: |
          : > "$RUNNER_TEMP/patches.txt"
          : > "$RUNNER_TEMP/foreign.txt"
          for sha in $(git rev-list --reverse "upstream/$BRANCH..$BRANCH"); do
            if git show -s --format=%B "$sha" | grep -qF "$PATCH_TRAILER"; then
              echo "$sha" >> "$RUNNER_TEMP/patches.txt"
            else
              echo "$sha" >> "$RUNNER_TEMP/foreign.txt"
            fi
          done
          echo "patch series:"
          while read -r s; do echo "  $(git log -1 --format='%h %s' "$s")"; done < "$RUNNER_TEMP/patches.txt"
          test -s "$RUNNER_TEMP/patches.txt" || { echo "No commits tagged with '$PATCH_TRAILER' on $BRANCH." >&2; exit 1; }
          # Commits without the trailer would be silently dropped by the rewrite below.
          test -s "$RUNNER_TEMP/foreign.txt" || exit 0
          echo "Commits on $BRANCH without '$PATCH_TRAILER' would be lost:" >&2
          while read -r s; do echo "  $(git log -1 --format='%h %s' "$s")" >&2; done < "$RUNNER_TEMP/foreign.txt"
          exit 1

      - name: Skip when upstream has not moved
        id: check
        run: |
          base="$(git rev-parse "$(head -1 "$RUNNER_TEMP/patches.txt")^")"
          if [ "$base" = "$upstream" ]; then
            echo "fork main is already replayed onto $upstream, nothing to do."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "rebasing patches from $base onto $upstream"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-java@v6
        if: steps.check.outputs.changed == 'true'
        with:
          distribution: 'liberica'
          java-version: '17'
          java-package: 'jdk+fx'

      - uses: gradle/actions/setup-gradle@v5
        if: steps.check.outputs.changed == 'true'
        with:
          cache-cleanup: never

      # Upstream rewrote gradle.yml into an OS/JDK matrix on 2026-11-13, i.e. it edits the
      # same workflow the patch series edits, so a hunk-by-hunk replay cannot succeed every
      # day. Two deterministic rules keep the replay convergent; anything else still fails
      # the run and names the files instead of reporting a bare "no longer applies".
      - name: Replay the patches onto the new upstream
        if: steps.check.outputs.changed == 'true'
        run: |
          : > "$RUNNER_TEMP/conflicts.txt"
          : > "$RUNNER_TEMP/resolved.txt"

          # The manifest is itself part of the patch series, so it is not on disk until the
          # replay reaches that commit; read it from the branch that is about to be rewritten.
          manifest="$RUNNER_TEMP/fork-owned.txt"
          git show "${BRANCH}:${FORK_OWNED}" 2>/dev/null | grep -v '^[[:space:]]*#' > "$manifest" || true
          is_fork_owned() {
            grep -qxF -- "$1" "$manifest"
          }

          git checkout -q -B rebuilt "$upstream"

          while read -r sha; do
            if git cherry-pick "$sha" > /dev/null 2>&1 < /dev/null; then
              continue
            fi

            mapfile -t pending < <(git diff --name-only --diff-filter=U)
            if [ "${#pending[@]}" -eq 0 ]; then
              echo "Patch $(git log -1 --format='%h %s' "$sha") stopped the replay without a conflict:" >&2
              git status --short >&2 || true
              git cherry-pick --abort > /dev/null 2>&1 || true
              exit 1
            fi

            blocked=0
            for path in "${pending[@]}"; do
              if ! git cat-file -e "${sha}:${path}" 2>/dev/null; then
                # The patch deletes this file. Dropping it is the patch's intent and it has
                # to win over upstream having edited the file in the meantime.
                git rm -q -f --ignore-unmatch -- "$path"
                echo "deleted \`${path}\` (patch $(git rev-parse --short "$sha"))" >> "$RUNNER_TEMP/resolved.txt"
              elif is_fork_owned "$path"; then
                # The fork publishes its own copy of this file, so the patch's version is
                # taken whole; the overlay below makes that final either way.
                git checkout "$sha" -- "$path"
                echo "kept the fork version of \`${path}\` (patch $(git rev-parse --short "$sha"))" >> "$RUNNER_TEMP/resolved.txt"
              else
                echo "\`${path}\` (patch $(git rev-parse --short "$sha"))" >> "$RUNNER_TEMP/conflicts.txt"
                blocked=1
              fi
            done

            if [ "$blocked" -ne 0 ]; then
              echo "Patch $(git log -1 --format='%h %s' "$sha") conflicts outside $FORK_OWNED:" >&2
              cat "$RUNNER_TEMP/conflicts.txt" >&2
              git diff --diff-filter=U --stat >&2 || true
              git cherry-pick --abort > /dev/null 2>&1 || true
              exit 1
            fi

            # --allow-empty keeps the patch series 1:1 with the local commits even when a
            # resolution gives the tree exactly what upstream already had.
            if ! GIT_EDITOR=true git cherry-pick --continue > /dev/null 2>&1 < /dev/null; then
              GIT_EDITOR=true git commit --allow-empty --no-edit -C "$sha" > /dev/null
              git cherry-pick --quit > /dev/null 2>&1 || true
            fi
          done < "$RUNNER_TEMP/patches.txt"

          # A fork-owned file is published exactly as the fork had it, no matter how the
          # patches above merged it: upstream may have restructured the file, and a partial
          # merge of that into the fork's copy yields a workflow nobody wrote. Restoring the
          # previous main's copy here is deterministic and independent of upstream's edits.
          while read -r path; do
            [ -n "$path" ] || continue
            git cat-file -e "${BRANCH}:${path}" 2>/dev/null || continue
            if git diff --quiet "$BRANCH" -- "$path"; then continue; fi
            git checkout "$BRANCH" -- "$path"
            echo "restored \`${path}\` from $BRANCH" >> "$RUNNER_TEMP/resolved.txt"
          done < "$manifest"

          if ! git diff --cached --quiet; then
            # Amending the previous overlay commit (when it is the tip, which it is on every
            # later sync) keeps exactly one such commit in the series instead of one a day.
            if git log -1 --format=%B | grep -qF "${PATCH_TRAILER} overlay"; then
              git commit -q --amend --no-edit
            else
              git commit -q -m "Reapply the fork-owned files over upstream" -m "${PATCH_TRAILER} overlay"
            fi
          fi

          git log --oneline -n 8
          if [ -s "$RUNNER_TEMP/resolved.txt" ]; then
            echo "auto-resolved during the replay:"
            cat "$RUNNER_TEMP/resolved.txt"
          fi

      # Cheap gate: prove the patches still apply and compile. The jar/exe/deb packaging
      # is done by gradle.yml, which the push below triggers.
      - name: Validate the patched tree
        if: steps.check.outputs.changed == 'true'
        run: ./gradlew checkstyleMain checkTranslations :HMCL:compileJava --no-daemon --parallel --stacktrace < /dev/null
        env:
          JAVA_TOOL_OPTIONS: -Djava.awt.headless=true

      - name: Publish the patched main
        id: publish
        if: steps.check.outputs.changed == 'true'
        env:
          FALLBACK_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          push() {
            git push "https://x-access-token:$1@github.com/${FORK}.git" \
              "refs/heads/rebuilt:refs/heads/$BRANCH" --force
          }
          if push "$PUSH_TOKEN"; then
            echo "published $(git rev-parse --short HEAD)" | tee -a "$RUNNER_TEMP/results.txt"
            if [ "$HAS_SYNC_TOKEN" = 'true' ]; then
              # A PAT push starts Java CI by itself and that run reaches publish-release.yml
              # through the workflow_run trigger, so nothing has to be dispatched here.
              echo "dispatch=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          else
            echo "::warning::the sync token cannot push this branch, retrying with GITHUB_TOKEN"
            push "$FALLBACK_TOKEN"
            echo "published $(git rev-parse --short HEAD) (GITHUB_TOKEN)" | tee -a "$RUNNER_TEMP/results.txt"
          fi
          echo "dispatch=true" >> "$GITHUB_OUTPUT"

      # Pushes made with GITHUB_TOKEN do not start other workflows, and a build started by
      # workflow_dispatch produces no workflow_run event either, so such a build has to be
      # published explicitly once it is green. Without this the sync would update main and
      # leave the build sitting in Actions.
      - name: Start the build
        if: steps.check.outputs.changed == 'true' && steps.publish.outputs.dispatch == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          sha="$(git rev-parse HEAD)"
          run_id=""
          for attempt in 1 2 3 4 5; do
            if gh workflow run gradle.yml --ref "$BRANCH"; then break; fi
            if [ "$attempt" = 5 ]; then echo "Cannot dispatch Java CI." >&2; exit 1; fi
            sleep 5
          done

          for attempt in $(seq 1 60); do
            run_id="$(gh run list --workflow gradle.yml --branch "$BRANCH" --limit 20 \
              --json databaseId,headSha \
              --jq "[.[] | select(.headSha == \"$sha\")][0].databaseId // empty")"
            [ -n "$run_id" ] && break
            sleep 5
          done
          test -n "$run_id" || { echo "Cannot find the Java CI run for $sha." >&2; exit 1; }
          echo "Java CI run $run_id started." | tee -a "$RUNNER_TEMP/results.txt"

          if gh run watch "$run_id" --exit-status --interval 15; then
            gh workflow run publish-release.yml --ref "$BRANCH" -f run_id="$run_id" -f sha="$sha"
            echo "Publishing run $run_id." | tee -a "$RUNNER_TEMP/results.txt"
          else
            echo "::warning::Java CI run $run_id failed, nothing was published"
            echo "Java CI run $run_id failed, nothing published." | tee -a "$RUNNER_TEMP/results.txt"
          fi

      - name: Summarize
        run: |
          {
            echo "Upstream: https://github.com/${UPSTREAM}/commit/${upstream}"
            echo
            echo '```'
            cat "$RUNNER_TEMP/results.txt" 2>/dev/null || echo 'no upstream change, nothing published'
            echo '```'
            if [ -s "$RUNNER_TEMP/resolved.txt" ]; then
              echo
              echo 'Automatically resolved while replaying the patches:'
              echo
              cat "$RUNNER_TEMP/resolved.txt"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # Issues are disabled on this fork, so the failure is surfaced through the step summary
      # and an error annotation instead of an issue.
      - name: Report a sync failure
        if: failure()
        run: |
          upstream_url="https://github.com/${UPSTREAM}/commit/${upstream}"
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          {
            echo '### 上游同步失败'
            echo
            echo '上游更新后，本地补丁重放、编译校验、推送或构建触发失败，分支没有被改写。'
            echo
            echo "- 上游：${upstream_url}"
            echo "- 失败的运行：${run_url}"
            if [ -s "$RUNNER_TEMP/conflicts.txt" ]; then
              echo
              echo '以下文件在上游被改动，补丁无法自动合并，需要人工改写对应的补丁提交：'
              echo
              cat "$RUNNER_TEMP/conflicts.txt"
            fi
            if [ -s "$RUNNER_TEMP/resolved.txt" ]; then
              echo
              echo '本次已自动处理：'
              echo
              cat "$RUNNER_TEMP/resolved.txt"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error title=上游同步失败::本地补丁重放、编译校验、推送或构建触发失败，详见 ${run_url}"
