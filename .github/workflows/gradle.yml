name: Java CI

on:
  push:
  pull_request:
    paths-ignore:
      - '**.md'

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
    - name: Set up JDK 17
      uses: actions/setup-java@v6
      with:
        distribution: 'liberica'
        java-version: '17'
        java-package: 'jdk+fx'
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v5
      with:
        cache-cleanup: never
    - name: Resolve the upstream version
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        version="$(curl -sf -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
          'https://api.github.com/repos/HMCL-dev/HMCL/releases?per_page=1' \
          | jq -r '.[0].tag_name // empty' | sed 's/^v//')"
        test -n "$version" || { echo "Cannot read the latest upstream release version." >&2; exit 1; }
        echo "VERSION_ROOT=$version" >> "$GITHUB_ENV"
    - name: Build with Gradle
      run: xvfb-run --auto-servernum ./gradlew build --no-daemon --parallel
      env:
        JAVA_TOOL_OPTIONS: -Djava.awt.headless=true
        BUILD_NUMBER: ${{ github.run_number }}
        MICROSOFT_AUTH_ID: ${{ secrets.MICROSOFT_AUTH_ID }}
        CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
    - name: Get short SHA
      run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV
    - name: Upload JAR
      uses: actions/upload-artifact@v7
      with:
        name: HMCL-${{ env.SHORT_SHA }}-jar
        path: HMCL/build/libs/HMCL-*.jar
        archive: false
    - name: Upload EXE
      uses: actions/upload-artifact@v7
      with:
        name: HMCL-${{ env.SHORT_SHA }}-exe
        path: HMCL/build/libs/HMCL-*.exe
        archive: false
    - name: Upload SH
      uses: actions/upload-artifact@v7
      with:
        name: HMCL-${{ env.SHORT_SHA }}-sh
        path: HMCL/build/libs/HMCL-*.sh
        archive: false
    - name: Upload DEB
      uses: actions/upload-artifact@v7
      with:
        name: HMCL-${{ env.SHORT_SHA }}-deb
        path: HMCL/build/libs/HMCL-*.deb
        archive: false
