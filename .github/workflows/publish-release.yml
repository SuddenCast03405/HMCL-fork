name: Publish CN build

on:
  workflow_run:
    workflows: ['Java CI']
    types: [completed]

permissions:
  contents: write
  actions: read

concurrency:
  group: publish-cn-build
  cancel-in-progress: false

jobs:
  publish:
    # Only the patched main branch is published, and only from a green build.
    if: >-
      github.repository == 'SuddenCast03405/HMCL-fork' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      FORK: ${{ github.repository }}
      RUN_ID: ${{ github.event.workflow_run.id }}
      SHA: ${{ github.event.workflow_run.head_sha }}

    steps:
      # The build uploads raw files (upload-artifact runs with archive: false), so the
      # download URL returns the binary itself rather than a zip, which is why the
      # download-artifact action cannot consume it. Fetching through the API and keeping
      # whichever shape arrives handles archived and raw artifacts alike.
      - name: Download the build outputs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p raw dist
          python3 - <<'PY' > artifacts.tsv
          import json, os, urllib.request

          token, run, repo = os.environ['GH_TOKEN'], os.environ['RUN_ID'], os.environ['FORK']
          req = urllib.request.Request(
              f'https://api.github.com/repos/{repo}/actions/runs/{run}/artifacts?per_page=100',
              headers={'Authorization': f'Bearer {token}',
                       'Accept': 'application/vnd.github+json',
                       'User-Agent': 'hmcl-cn-publish'})
          with urllib.request.urlopen(req) as response:
              for artifact in json.load(response)['artifacts']:
                  if not artifact['expired']:
                      print(f"{artifact['id']}\t{artifact['name']}")
          PY
          while IFS=$'\t' read -r id name; do
            [ -n "$id" ] || continue
            tmp="$(mktemp)"
            curl -sfL -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/$FORK/actions/artifacts/$id/zip" -o "$tmp"
            # A jar is itself a zip, so unzip-ability cannot tell the shapes apart:
            # an extension means the artifact holds that single file verbatim.
            case "$name" in
              *.jar|*.exe|*.sh|*.deb) cp "$tmp" "raw/$name" ;;
              *) unzip -oq "$tmp" -d raw ;;
            esac
            rm -f "$tmp"
          done < artifacts.tsv

      - name: Collect the build outputs
        run: |
          find raw -type f \( -name 'HMCL-*.jar' -o -name 'HMCL-*.exe' -o -name 'HMCL-*.sh' -o -name 'HMCL-*.deb' \) -exec cp {} dist/ \;
          find dist -type f -printf '%f\n' | sort > files.txt
          test -s files.txt || { echo "Run $RUN_ID produced no HMCL artifact." >&2; exit 1; }
          version="$(sed -n 's/^HMCL-\(.*\)\.\(jar\|exe\|sh\|deb\)$/\1/p' files.txt | head -1)"
          test -n "$version" || { echo "Cannot read the version from: $(tr '\n' ' ' < files.txt)" >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_ENV"

      # The note carries the official changelog and the checksums only; it deliberately does
      # not describe this fork or link back to its build.
      - name: Write the release note
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY' > CHANGELOG.md
          import json, os, re, sys, urllib.request

          token = os.environ['GH_TOKEN']
          upstream_version = os.environ['VERSION'].split('-unofficial.')[0]

          def get(url):
              request = urllib.request.Request(url, headers={
                  'Authorization': f'Bearer {token}',
                  'Accept': 'application/vnd.github+json',
                  'User-Agent': 'hmcl-cn-publish'})
              with urllib.request.urlopen(request, timeout=30) as response:
                  return response.read()

          def key(name):
              return tuple(int(part) for part in re.findall(r'\d+', name))

          def listdir(path):
              return json.loads(get(f'https://api.github.com/repos/HMCL-dev/HMCL-docs/contents/{path}'))

          # Prefer the changelog of the release being packaged, but fall back to the newest
          # published changelog when upstream has not written one for that build yet.
          def latest_entry():
              wanted = key(upstream_version)
              dirs = [entry['name'] for entry in listdir('_changelogs/dev')
                      if entry['type'] == 'dir' and key(entry['name']) <= wanted]
              if not dirs:
                  return None
              directory = f'_changelogs/dev/{max(dirs, key=key)}'
              files = [entry for entry in listdir(directory)
                       if entry['type'] == 'file' and entry['name'].endswith('.md')
                       and key(entry['name']) <= wanted]
              if not files:
                  return None
              return max(files, key=lambda entry: key(entry['name']))

          try:
              entry = latest_entry()
              text = get(entry['download_url']).decode('utf-8') if entry else ''
          except Exception as error:
              print(f'Cannot fetch the official changelog: {error}', file=sys.stderr)
              entry, text = None, ''

          if text.count('---') >= 2:
              text = text.split('---', 2)[2]
          text = text.strip()

          print('## 官方更新日志\n')
          if entry and text:
              changelog_version = entry['name'][:-3]
              # Upstream sometimes publishes builds before writing their changelog.
              note = '' if changelog_version == upstream_version else '（当前最新公开日志）'
              print(f'### HMCL {changelog_version}{note}\n')
              print(text)
          else:
              print('https://docs.hmcl.net/changelog/dev.html')
          PY
          {
            cat CHANGELOG.md
            echo
            echo '| 文件 | SHA-256 |'
            echo '| :--- | :--- |'
            (cd dist && while IFS= read -r f; do
              echo "| $f | \`$(sha256sum "$f" | cut -d' ' -f1)\` |"
            done < ../files.txt)
          } > RELEASE_NOTE

      # Each build gets its own release named after the version. A re-run of the same
      # commit recreates it in place, and the old rolling cn-latest tag from earlier
      # builds is cleaned up so it does not linger.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # There is no checkout in a workflow_run job, so gh needs to be told the repo.
          GH_REPO: ${{ github.repository }}
        run: |
          tag="v${version}"
          gh release delete "$tag" --cleanup-tag --yes > /dev/null 2>&1 || true
          gh release delete cn-latest --cleanup-tag --yes > /dev/null 2>&1 || true
          mapfile -t assets < files.txt
          cd dist
          gh release create "$tag" "${assets[@]}" \
            --target "$SHA" \
            --title "$version" \
            --notes-file ../RELEASE_NOTE \
            --prerelease
